name: Pre-merge

on:
  pull_request:
    branches: [ main, dev ]
  
jobs:

  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Install pylint
        run: |
          pip install pylint
      - name: Analysing the code with pylint
        run: |
          pylint $(git ls-files '*.py')
  
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Install pytest
        run: |
          pip install pytest
          pip install pytest-cov
      - name: Run pytest with coverage report
        run:
           python -m pytest --cov-report term-missing --cov=src/  --no-cov-on-fail --cov-fail-under=40


  check-version-change:
    runs-on: ubuntu-latest
    needs:
      - pylint
      - tests
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: fetch repo
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
      - name: get versions
        run: |
          PREVIOUS_VER=$(git show FETCH_HEAD:pyproject.toml | grep -E '^version = ' | head -n 1 | cut -d '"' -f 2)
          CURRENT_VER=$(grep -E '^version = ' pyproject.toml | head -n 1 | cut -d '"' -f 2)
      - name: compare versions
        run: |
          if [ "$PREVIOUS_VER" = "$CURRENT_VER" ]; then
            echo "Error: Package version has not been bumped!"
            exit 1
          else
            echo "Success: Version $PREVIOUS_VER has been bumped to $CURRENT_VER!"
          fi